<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Daria (Eryn) H. Zahaleanu</title>
    <script>
      // GitHub Pages SPA redirect: encode path into query string, redirect to index
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + '/?p=' +
        encodeURIComponent(l.pathname + l.search) +
        (l.hash ? '&h=' + encodeURIComponent(l.hash) : '')
      );
    </script>
  </head>
  <body></body>
</html>
